<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAQSAD MAXIMUM — AI Prediction Engine</title>
  <meta name="description" content="MAQSAD MAXIMUM - AI Pattern Based Prediction Engine" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --background: hsl(220, 25%, 8%);
      --foreground: hsl(45, 100%, 85%);
      --card: hsl(220, 30%, 12%);
      --primary: hsl(45, 100%, 60%);
      --primary-foreground: hsl(220, 25%, 8%);
      --muted-foreground: hsl(220, 15%, 55%);
      --border: hsl(45, 50%, 30%);
      --cyber-card: hsl(220, 30%, 14%);
      --cyber-card-dark: hsl(220, 30%, 10%);
      --cyber-dark: hsl(220, 30%, 8%);
      --gold-light: hsl(45, 100%, 75%);
      --gold-dark: hsl(45, 100%, 50%);
      --success: hsl(120, 60%, 50%);
      --warning: hsl(45, 100%, 50%);
      --danger: hsl(0, 70%, 55%);
    }

    html, body { overflow: hidden; height: 100%; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Screens ===== */
    .screen { display: none; height: 100vh; overflow: hidden; }
    .screen.active { display: flex; }

    /* ===== Gradient Text ===== */
    .gradient-gold-text {
      background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== Toast ===== */
    .toast-container {
      position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
      z-index: 9999; pointer-events: none;
    }
    .toast {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border: 1px solid var(--border); color: var(--primary);
      padding: 0.875rem 1.5rem; border-radius: 0.5rem;
      font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      box-shadow: 0 0 20px hsla(45, 100%, 60%, 0.15);
      opacity: 0; transform: translateY(-20px);
      transition: all 0.3s ease; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ===== Link Screen ===== */
    #link-screen { flex-direction: column; height: 100vh; }

    .top-header {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border-bottom: 1px solid var(--border); padding: 1rem;
    }
    .top-title {
      font-size: 1.5rem; font-weight: 700; text-align: center;
      text-transform: uppercase; letter-spacing: 0.15em;
    }

    .main-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 1rem;
    }

    .game-card {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border: 1px solid var(--border); border-radius: 0.75rem;
      padding: 1.5rem 2rem; width: 100%; max-width: 28rem;
      box-shadow: 0 0 30px hsla(45, 100%, 60%, 0.1), inset 0 1px 0 hsla(45, 100%, 60%, 0.1);
      animation: slideUp 0.5s ease-out;
    }

    .card-title {
      font-size: 1.25rem; font-weight: 700; text-align: center;
      margin-bottom: 0.5rem; color: var(--primary); text-transform: uppercase;
    }
    .card-subtitle {
      text-align: center; color: var(--muted-foreground);
      font-size: 0.875rem; margin-bottom: 1.5rem; text-transform: uppercase;
    }

    .game-input {
      width: 100%; background: var(--cyber-dark);
      border: 1px solid transparent; border-radius: 0.5rem;
      padding: 0.75rem 1rem; color: var(--foreground);
      font-family: 'Rajdhani', sans-serif; font-size: 0.875rem;
      margin-bottom: 1rem; outline: none; transition: box-shadow 0.2s;
    }
    .game-input:focus { box-shadow: 0 0 0 2px var(--primary); }
    .game-input::placeholder { color: var(--muted-foreground); }

    .game-button {
      width: 100%; padding: 0.875rem; border: none; border-radius: 0.5rem;
      font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--primary-foreground);
      background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
      box-shadow: 0 4px 15px hsla(45, 100%, 60%, 0.3);
      cursor: pointer; transition: all 0.3s ease;
    }
    .game-button:hover {
      box-shadow: 0 6px 25px hsla(45, 100%, 60%, 0.5);
      transform: translateY(-2px);
    }
    .game-button:active { transform: translateY(0); }

    /* ===== Game Screen ===== */
    #game-screen { flex-direction: column; height: 100vh; overflow: hidden; }

    .game-container {
      position: relative; flex: 1; width: 100%;
      display: flex; flex-direction: column;
    }

    .prediction-bar {
      position: absolute; top: 0.5rem; left: 0.5rem; right: 0.5rem;
      z-index: 10; display: flex; justify-content: space-between;
      align-items: center; padding: 0.625rem 0.75rem;
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border: 1px solid hsla(45, 50%, 30%, 0.5); border-radius: 0.5rem;
      animation: pulseGlow 2s ease-in-out infinite;
    }

    .prediction-item {
      display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
    }
    .prediction-label {
      font-size: 10px; color: var(--muted-foreground);
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .prediction-value {
      font-size: 0.75rem; font-weight: 700; color: var(--foreground);
    }
    .prediction-value.primary { color: var(--primary); }
    .numbers-container { display: flex; gap: 0.5rem; }

    .iframe-wrapper { flex: 1; width: 100%; }
    .iframe-wrapper iframe { width: 100%; height: 100%; border: none; }

    .text-success { color: var(--success); }
    .text-warning { color: var(--warning); }
    .text-danger  { color: var(--danger); }

    /* ===== History Button ===== */
    .history-fab {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 40;
      width: 3.5rem; height: 3.5rem; border-radius: 50%; border: none;
      background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
      box-shadow: 0 4px 15px hsla(45, 100%, 60%, 0.3);
      cursor: pointer; display: none; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .history-fab.visible { display: flex; }
    .history-fab:hover {
      box-shadow: 0 6px 25px hsla(45, 100%, 60%, 0.5);
      transform: scale(1.05);
    }
    .history-fab svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: var(--primary-foreground); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== History Panel ===== */
    .history-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      background: var(--background);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .history-overlay.open { transform: translateY(0); }

    .history-header {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border-bottom: 1px solid var(--border); padding: 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .history-header-left { display: flex; align-items: center; gap: 0.5rem; }
    .history-header-left svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .history-title { font-size: 1.25rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }

    .close-btn {
      width: 2.25rem; height: 2.25rem; border-radius: 0.5rem;
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border: 1px solid var(--border); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s; color: var(--foreground);
    }
    .close-btn:hover { color: var(--primary); }
    .close-btn svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem; padding: 0.75rem; border-bottom: 1px solid var(--border);
    }
    .stat-card {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border: 1px solid hsla(45, 50%, 30%, 0.5); border-radius: 0.5rem;
      padding: 0.5rem; display: flex; flex-direction: column; align-items: center;
    }
    .stat-label { font-size: 9px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.1em; }
    .stat-value { font-size: 1.125rem; font-weight: 700; }

    .history-list { flex: 1; overflow-y: auto; padding: 0.75rem; }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .history-empty {
      display: flex; align-items: center; justify-content: center; height: 100%;
      color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.875rem;
    }

    .history-record {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border: 1px solid hsla(45, 50%, 30%, 0.5); border-radius: 0.5rem;
      padding: 0.75rem; margin-bottom: 0.5rem;
      display: flex; align-items: center; justify-content: space-between;
      animation: fadeInLeft 0.3s ease-out;
    }
    .record-col { display: flex; flex-direction: column; gap: 2px; }
    .record-col.end { align-items: flex-end; }
    .record-col.center { align-items: center; }
    .record-label { font-size: 10px; color: var(--muted-foreground); text-transform: uppercase; }
    .record-value { font-size: 0.875rem; font-weight: 700; color: var(--foreground); }
    .record-value.primary { color: var(--primary); }

    .status-badge {
      font-size: 0.75rem; font-weight: 700; padding: 0.125rem 0.5rem; border-radius: 0.25rem;
    }
    .status-PENDING { color: var(--muted-foreground); background: hsla(220, 15%, 55%, 0.15); }
    .status-WIN { color: var(--success); background: hsla(120, 60%, 50%, 0.15); }
    .status-LOSS { color: var(--danger); background: hsla(0, 70%, 55%, 0.15); }
    .status-JACKPOT { color: var(--primary); background: hsla(45, 100%, 60%, 0.15); }

    /* ===== Animations ===== */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px hsla(45, 100%, 60%, 0.15); }
      50%      { box-shadow: 0 0 35px hsla(45, 100%, 60%, 0.3); }
    }
    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ===== Responsive ===== */
    @media (min-width: 640px) {
      .top-title        { font-size: 1.875rem; }
      .card-title       { font-size: 1.5rem; }
      .prediction-value { font-size: 0.875rem; }
    }
  </style>
</head>
<body>

  <!-- Toast -->
  <div class="toast-container"><div class="toast" id="toast-msg"></div></div>

  <!-- Link Screen -->
  <div id="link-screen" class="screen active">
    <div class="top-header">
      <h1 class="top-title gradient-gold-text">MAQSAD MAXIMUM</h1>
    </div>
    <div class="main-content">
      <div class="game-card">
        <h2 class="card-title">MAQSAD MAXIMUM</h2>
        <p class="card-subtitle">Paste your URL to continue</p>
        <input type="url" id="game-link-input" class="game-input" placeholder="https://example.com/game">
        <button id="start-button" class="game-button">UNLOCK</button>
      </div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <div class="game-container">
      <div class="prediction-bar">
        <div class="prediction-item">
          <span class="prediction-label">PERIOD NO</span>
          <span class="prediction-value" id="period-display">00000</span>
        </div>
        <div class="prediction-item">
          <span class="prediction-label">TIMER</span>
          <span class="prediction-value" id="timer-display">00:30</span>
        </div>
        <div class="prediction-item">
          <span class="prediction-label">AI PREDICT</span>
          <span class="prediction-value primary" id="prediction-display">---</span>
        </div>
        <div class="prediction-item">
          <span class="prediction-label">JACKPOT</span>
          <div class="numbers-container">
            <span class="prediction-value" id="number1-display">0</span>
            <span class="prediction-value" id="number2-display">0</span>
          </div>
        </div>
        <div class="prediction-item">
          <span class="prediction-label">CONFIDENCE</span>
          <span class="prediction-value" id="confidence-display">LOW</span>
        </div>
      </div>
      <div class="iframe-wrapper">
        <iframe id="game-iframe" title="Game Frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>
    </div>

    <!-- History FAB -->
    <button class="history-fab visible" id="history-btn" style="display:none;">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </button>
  </div>

  <!-- History Panel -->
  <div class="history-overlay" id="history-panel">
    <div class="history-header">
      <div class="history-header-left">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <h2 class="history-title gradient-gold-text">Prediction History</h2>
      </div>
      <button class="close-btn" id="history-close">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><span class="stat-label">Predictions</span><span class="stat-value" id="stat-total" style="color:var(--foreground)">0</span></div>
      <div class="stat-card"><span class="stat-label">Wins</span><span class="stat-value" id="stat-wins" style="color:var(--success)">0</span></div>
      <div class="stat-card"><span class="stat-label">Losses</span><span class="stat-value" id="stat-losses" style="color:var(--danger)">0</span></div>
      <div class="stat-card"><span class="stat-label">Jackpots</span><span class="stat-value" id="stat-jackpots" style="color:var(--primary)">0</span></div>
    </div>
    <div class="history-list" id="history-list">
      <div class="history-empty">No predictions yet</div>
    </div>
  </div>

  <script>
    /* ========================================
       MAQSAD MAXIMUM — AI Prediction Engine
       Standalone Single-File Application
       Deterministic: same API data + UTC time
       = same result on every device worldwide.
    ======================================== */

    /* ===== Toast ===== */
    var toastTimeout = null;
    function showToast(msg, duration) {
      var el = document.getElementById('toast-msg');
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function () { el.classList.remove('show'); }, duration || 3000);
    }

    /* ===== Screen Management ===== */
    var screens = { link: document.getElementById('link-screen'), game: document.getElementById('game-screen') };
    function showScreen(name) {
      Object.values(screens).forEach(function (s) { s.classList.remove('active'); });
      screens[name].classList.add('active');
    }

    /* ===== Link Screen ===== */
    document.getElementById('game-link-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') startGame(); });
    document.getElementById('start-button').addEventListener('click', startGame);

    function startGame() {
      var link = document.getElementById('game-link-input').value.trim();
      if (!link) { showToast('SET UP YOUR PLATFORM', 5000); return; }
      document.getElementById('game-iframe').src = link;
      document.getElementById('history-btn').style.display = 'flex';
      showScreen('game');
      startPredictionSystem();
    }

    /* ===== History Panel ===== */
    document.getElementById('history-btn').addEventListener('click', function () {
      document.getElementById('history-panel').classList.add('open');
    });
    document.getElementById('history-close').addEventListener('click', function () {
      document.getElementById('history-panel').classList.remove('open');
    });

    var predictionHistory = [];
    var lastPeriodTracked = '';

    function updateStats() {
      var total = predictionHistory.length;
      var wins = predictionHistory.filter(function (r) { return r.status === 'WIN'; }).length;
      var losses = predictionHistory.filter(function (r) { return r.status === 'LOSS'; }).length;
      var jackpots = predictionHistory.filter(function (r) { return r.status === 'JACKPOT'; }).length;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-wins').textContent = wins;
      document.getElementById('stat-losses').textContent = losses;
      document.getElementById('stat-jackpots').textContent = jackpots;
    }

    function renderHistory() {
      var container = document.getElementById('history-list');
      if (predictionHistory.length === 0) {
        container.innerHTML = '<div class="history-empty">No predictions yet</div>';
        return;
      }
      var html = '';
      predictionHistory.forEach(function (r) {
        html += '<div class="history-record">'
          + '<div class="record-col"><span class="record-label">Period</span><span class="record-value">' + r.period + '</span></div>'
          + '<div class="record-col center"><span class="record-label">Predict</span><span class="record-value primary">' + r.prediction + '</span></div>'
          + '<div class="record-col center"><span class="record-label">Numbers</span><span class="record-value">' + r.numbers[0] + ', ' + r.numbers[1] + '</span></div>'
          + '<div class="record-col end"><span class="record-label">Status</span><span class="status-badge status-' + r.status + '">' + r.status + '</span></div>'
          + '</div>';
      });
      container.innerHTML = html;
    }

    /* ===== Deterministic Prediction Engine ===== */
    var historyData = [];

    function generateNumbers(prediction, seed) {
      var pool = prediction === 'BIG' ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
      var idx1 = seed % pool.length;
      var idx2 = (seed + 2) % pool.length;
      var num1 = pool[idx1];
      var num2 = pool[idx2];
      if (num1 === num2) num2 = pool[(idx2 + 1) % pool.length];
      return [num1, num2];
    }

    function analyzePatterns() {
      if (historyData.length < 3) {
        return { prediction: 'BIG', numbers: [5, 6], confidence: 'LOW', reasoning: 'Insufficient data' };
      }

      var numbers = historyData.map(function (h) { return parseInt(h.number, 10); });
      var results = numbers.map(function (n) { return n >= 5 ? 'BIG' : 'SMALL'; });

      var streakCount = 1;
      var lastResult = results[0];
      for (var i = 1; i < results.length; i++) {
        if (results[i] === lastResult) streakCount++;
        else break;
      }

      var recent10 = results.slice(0, 10);
      var bigCount = recent10.filter(function (r) { return r === 'BIG'; }).length;
      var smallCount = recent10.length - bigCount;

      var alternations = 0;
      var altLen = Math.min(results.length - 1, 10);
      for (var j = 0; j < altLen; j++) {
        if (results[j] !== results[j + 1]) alternations++;
      }
      var alternationRatio = alternations / Math.max(altLen, 1);

      var recentSum = numbers.slice(0, 5).reduce(function (a, b) { return a + b; }, 0);
      var avgRecent = recentSum / Math.min(numbers.length, 5);

      var lastNumber = numbers[0];
      var numberRepeatCount = numbers.slice(0, 5).filter(function (n) { return n === lastNumber; }).length;

      var prediction, confidence, reasoning;

      if (streakCount >= 5) {
        prediction = lastResult === 'BIG' ? 'SMALL' : 'BIG';
        confidence = 'HIGH';
        reasoning = 'Streak ' + streakCount + 'x ' + lastResult + ' — reversal expected';
      } else if (streakCount >= 3) {
        prediction = lastResult === 'BIG' ? 'SMALL' : 'BIG';
        confidence = 'MEDIUM';
        reasoning = 'Streak ' + streakCount + 'x ' + lastResult + ' — likely change';
      } else if (alternationRatio > 0.7) {
        prediction = lastResult === 'BIG' ? 'SMALL' : 'BIG';
        confidence = 'HIGH';
        reasoning = 'Alternating pattern detected';
      } else if (Math.abs(bigCount - smallCount) >= 4) {
        prediction = bigCount > smallCount ? 'SMALL' : 'BIG';
        confidence = 'MEDIUM';
        reasoning = 'Imbalance: ' + bigCount + 'B/' + smallCount + 'S';
      } else if (avgRecent >= 6) {
        prediction = 'SMALL';
        confidence = 'MEDIUM';
        reasoning = 'High avg (' + avgRecent.toFixed(1) + ') — correction';
      } else if (avgRecent <= 3) {
        prediction = 'BIG';
        confidence = 'MEDIUM';
        reasoning = 'Low avg (' + avgRecent.toFixed(1) + ') — correction';
      } else if (numberRepeatCount >= 3) {
        prediction = lastNumber >= 5 ? 'SMALL' : 'BIG';
        confidence = 'MEDIUM';
        reasoning = 'Number ' + lastNumber + ' repeating';
      } else {
        prediction = lastResult;
        confidence = 'LOW';
        reasoning = 'Following momentum';
      }

      var seedNumber = numbers.slice(0, 3).reduce(function (a, b) { return a + b; }, 0);
      return { prediction: prediction, numbers: generateNumbers(prediction, seedNumber), confidence: confidence, reasoning: reasoning };
    }

    /* ===== Period & Timer (UTC) ===== */
    function getPeriodAndTimer() {
      var now = new Date();
      var totalSeconds = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
      var upcomingPeriod = Math.floor(totalSeconds / 30) + 1;
      var y = now.getUTCFullYear();
      var m = String(now.getUTCMonth() + 1).padStart(2, '0');
      var d = String(now.getUTCDate()).padStart(2, '0');
      var fullPeriod = y + m + d + '100005' + String(upcomingPeriod).padStart(4, '0');
      var remaining = 30 - (now.getUTCSeconds() % 30);
      return { period: fullPeriod.slice(-5), remaining: remaining, fullPeriod: fullPeriod };
    }

    function updatePeriodTimer() {
      var info = getPeriodAndTimer();
      document.getElementById('period-display').textContent = info.period;
      document.getElementById('timer-display').textContent = '00:' + String(info.remaining).padStart(2, '0');
    }

    /* ===== Display ===== */
    function updatePredictionDisplay(data) {
      document.getElementById('prediction-display').textContent = data.prediction;
      document.getElementById('number1-display').textContent = data.numbers[0];
      document.getElementById('number2-display').textContent = data.numbers[1];
      var confEl = document.getElementById('confidence-display');
      confEl.textContent = data.confidence;
      confEl.className = 'prediction-value';
      if (data.confidence === 'HIGH') confEl.classList.add('text-success');
      else if (data.confidence === 'MEDIUM') confEl.classList.add('text-warning');
      else confEl.classList.add('text-danger');
    }

    /* ===== Data Fetching & History Tracking ===== */
    async function fetchAllData() {
      try {
        var ts = Date.now();
        var results = await Promise.allSettled([
          fetch('https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=' + ts),
          fetch('https://api.bdg88zf.com/api/webapi/GetGameIssue', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              typeId: 1, language: 0,
              random: 'abb9f056ac7d47f0b1689be6e1e3a8c9',
              signature: '5C2C02FABC29A87F5D5B95B0ECBA967F',
              timestamp: Math.floor(Date.now() / 1000)
            })
          })
        ]);

        var historyRes = results[0];
        if (historyRes.status === 'fulfilled' && historyRes.value.ok) {
          var json = await historyRes.value.json();
          if (json && json.data && Array.isArray(json.data.list)) {
            historyData = json.data.list.slice(0, 20);
            var analysis = analyzePatterns();
            updatePredictionDisplay(analysis);

            var currentInfo = getPeriodAndTimer();
            var currentPeriod = currentInfo.period;

            // Resolve previous pending predictions
            if (lastPeriodTracked && lastPeriodTracked !== currentPeriod && historyData.length > 0) {
              var actualNumber = parseInt(historyData[0].number, 10);
              var actualResult = actualNumber >= 5 ? 'BIG' : 'SMALL';
              predictionHistory.forEach(function (record) {
                if (record.status === 'PENDING') {
                  var isNumberMatch = record.numbers.indexOf(actualNumber) !== -1;
                  if (isNumberMatch) record.status = 'JACKPOT';
                  else if (record.prediction === actualResult) record.status = 'WIN';
                  else record.status = 'LOSS';
                  record.actualNumber = actualNumber;
                }
              });
            }

            // Add new prediction record
            if (currentPeriod !== lastPeriodTracked) {
              predictionHistory.unshift({
                id: currentPeriod + '-' + Date.now(),
                period: currentPeriod,
                prediction: analysis.prediction,
                numbers: analysis.numbers,
                confidence: analysis.confidence,
                status: 'PENDING',
                timestamp: Date.now()
              });
              lastPeriodTracked = currentPeriod;
            }

            updateStats();
            renderHistory();
          }
        }

        var issueRes = results[1];
        if (issueRes.status === 'fulfilled' && issueRes.value.ok) {
          var issueJson = await issueRes.value.json();
          if (issueJson && issueJson.data) {
            console.log('GameIssue synced:', issueJson.data.issueNumber);
          }
        }
      } catch (e) {
        console.error('Failed to fetch data:', e);
      }
    }

    /* ===== Start System ===== */
    var tickerInterval = null;
    var fetchInterval = null;

    function startPredictionSystem() {
      fetchAllData();
      updatePeriodTimer();
      if (tickerInterval) clearInterval(tickerInterval);
      tickerInterval = setInterval(updatePeriodTimer, 1000);
      if (fetchInterval) clearInterval(fetchInterval);
      fetchInterval = setInterval(fetchAllData, 3000);
    }
  </script>
