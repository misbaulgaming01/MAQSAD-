<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAQSAD MAXIMUM</title>
  <meta name="description" content="MAQSAD MAXIMUM" />
  <style>
    @font-face {
      font-family: 'Smarty';
      src: url('fonts/smarty.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: hsl(220, 25%, 8%);
      --foreground: hsl(45, 100%, 85%);
      --card: hsl(220, 30%, 12%);
      --card-foreground: hsl(45, 100%, 85%);
      --primary: hsl(45, 100%, 60%);
      --primary-foreground: hsl(220, 25%, 8%);
      --muted-foreground: hsl(220, 15%, 55%);
      --border: hsl(45, 50%, 30%);
      --cyber-dark: hsl(220, 30%, 8%);
      --cyber-card: hsl(220, 30%, 14%);
      --cyber-card-dark: hsl(220, 30%, 10%);
      --gold-light: hsl(45, 100%, 75%);
      --gold-dark: hsl(45, 100%, 50%);
    }

    body {
      font-family: 'Smarty', 'Orbitron', sans-serif;
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .screen {
      display: none;
      min-height: 100vh;
    }

    .screen.active {
      display: flex;
    }

    /* Utility Classes */
    .gradient-card {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
    }

    .gradient-gold {
      background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
    }

    .gradient-gold-text {
      background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .glow-gold {
      box-shadow: 0 0 30px hsla(45, 100%, 60%, 0.1), inset 0 1px 0 hsla(45, 100%, 60%, 0.1);
    }

    .glow-gold-strong {
      box-shadow: 0 4px 15px hsla(45, 100%, 60%, 0.3);
    }

    /* Link Screen */
    #link-screen {
      flex-direction: column;
      min-height: 100vh;
    }

    .top-header {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border-bottom: 1px solid var(--border);
      padding: 1rem;
    }

    .top-title {
      font-size: 1.5rem;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (min-width: 640px) {
      .top-title {
        font-size: 1.875rem;
      }
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .game-card {
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem 2rem;
      width: 100%;
      max-width: 28rem;
      box-shadow: 0 0 30px hsla(45, 100%, 60%, 0.1), inset 0 1px 0 hsla(45, 100%, 60%, 0.1);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    @media (min-width: 640px) {
      .card-title {
        font-size: 1.5rem;
      }
    }

    .card-subtitle {
      text-align: center;
      color: var(--muted-foreground);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .game-input {
      width: 100%;
      background: var(--cyber-dark);
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: var(--foreground);
      font-family: 'Smarty', 'Orbitron', sans-serif;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      outline: none;
    }

    .game-input:focus {
      box-shadow: 0 0 0 2px var(--primary);
    }

    .game-input::placeholder {
      color: var(--muted-foreground);
    }

    .game-button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.5rem;
      font-family: 'Smarty', 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--primary-foreground);
      background: linear-gradient(180deg, hsl(45, 100%, 75%), hsl(45, 100%, 50%));
      box-shadow: 0 4px 15px hsla(45, 100%, 60%, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .game-button:hover:not(:disabled) {
      box-shadow: 0 6px 25px hsla(45, 100%, 60%, 0.5);
      transform: translateY(-2px);
    }

    .game-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .bottom-telegram {
      display: block;
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border-top: 1px solid var(--border);
      padding: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .bottom-telegram:hover {
      background: var(--cyber-card);
    }

    .telegram-text {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--primary);
    }

    @media (min-width: 640px) {
      .telegram-text {
        font-size: 1.5rem;
      }
    }

    /* Game Screen */
    #game-screen {
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .prediction-bar {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      right: 0.5rem;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.625rem 0.75rem;
      background: linear-gradient(145deg, var(--cyber-card), var(--cyber-card-dark));
      border: 1px solid hsla(45, 50%, 30%, 0.5);
      border-radius: 0.5rem;
    }

    .prediction-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .prediction-label {
      font-size: 10px;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .prediction-value {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--foreground);
    }

    @media (min-width: 640px) {
      .prediction-value {
        font-size: 0.875rem;
      }
    }

    .numbers-container {
      display: flex;
      gap: 0.5rem;
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Link Screen -->
  <div id="link-screen" class="screen active">
    <div class="top-header">
      <h1 class="top-title">MAQSAD MAXIMUM</h1>
    </div>
    <div class="main-content">
      <div class="game-card">
        <h2 class="card-title">Enter Game Link</h2>
        <p class="card-subtitle">Paste your game URL to continue</p>
        <input 
          type="url" 
          id="game-link-input" 
          class="game-input" 
          placeholder="https://example.com/game"
        >
        <button id="start-button" class="game-button" disabled>Start Game</button>
      </div>
    </div>
    <a href="https://t.me/+xLTHqVYg69hhMGM1" target="_blank" rel="noopener noreferrer" class="bottom-telegram">
      <p class="telegram-text">TELEGRAM</p>
    </a>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <div class="game-container">
      <div class="prediction-bar">
        <div class="prediction-item">
          <span class="prediction-label">Period</span>
          <span class="prediction-value" id="period-display">00000</span>
        </div>
        <div class="prediction-item">
          <span class="prediction-label">Timer</span>
          <span class="prediction-value" id="timer-display">00:30</span>
        </div>
        <div class="prediction-item">
          <span class="prediction-label">Prediction</span>
          <span class="prediction-value" id="prediction-display">BIG</span>
        </div>
        <div class="prediction-item">
          <span class="prediction-label">Numbers</span>
          <div class="numbers-container">
            <span class="prediction-value" id="number1-display">0</span>
            <span class="prediction-value" id="number2-display">0</span>
          </div>
        </div>
      </div>
      <div class="iframe-wrapper">
        <iframe id="game-iframe" title="Game Frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>
    </div>
  </div>

  <script>
    // Screen Management
    const screens = {
      link: document.getElementById('link-screen'),
      game: document.getElementById('game-screen')
    };

    function showScreen(screenName) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[screenName].classList.add('active');
    }

    // Link Screen
    const gameLinkInput = document.getElementById('game-link-input');
    const startButton = document.getElementById('start-button');

    gameLinkInput.addEventListener('input', () => {
      const isValid = gameLinkInput.value.trim().length > 0;
      startButton.disabled = !isValid;
    });

    gameLinkInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && gameLinkInput.value.trim().length > 0) {
        startGame();
      }
    });

    startButton.addEventListener('click', startGame);

    function startGame() {
      const gameLink = gameLinkInput.value.trim();
      if (gameLink) {
        document.getElementById('game-iframe').src = gameLink;
        showScreen('game');
        startPredictionSystem();
      }
    }

    // Game Screen - Prediction System
    let predictionInterval;

    function generateNumbers() {
      // BIG: 5 & 9, SMALL: 0 & 4
      const isBig = Math.random() > 0.5;
      const bigNumbers = [5, 9];
      const smallNumbers = [0, 4];
      
      const numbers = isBig ? bigNumbers : smallNumbers;
      const shuffled = [...numbers].sort(() => Math.random() - 0.5);

      document.getElementById('number1-display').textContent = shuffled[0];
      document.getElementById('number2-display').textContent = shuffled[1];
      document.getElementById('prediction-display').textContent = isBig ? 'BIG' : 'SMALL';
    }

    function updatePeriodAndTimer() {
      const now = new Date();
      const options = { 
        timeZone: 'Atlantic/Reykjavik', 
        hour12: false,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      
      const reykjavikString = now.toLocaleString('en-US', options);
      const reykjavikTime = new Date(reykjavikString);

      const hours = reykjavikTime.getHours();
      const minutes = reykjavikTime.getMinutes();
      const seconds = reykjavikTime.getSeconds();

      // Calculate total periods (each period is 30 seconds)
      const totalPeriods = Math.floor((hours * 3600 + minutes * 60 + seconds) / 30);
      const upcomingPeriod = totalPeriods + 1;

      // Format date as yyyyMMdd
      const year = reykjavikTime.getFullYear();
      const month = String(reykjavikTime.getMonth() + 1).padStart(2, '0');
      const day = String(reykjavikTime.getDate()).padStart(2, '0');
      const formattedDate = year + month + day;

      // Create period number and get last 5 digits only
      const periodNumber = '100005' + String(upcomingPeriod).padStart(4, '0');
      const originalPeriodNumber = formattedDate + periodNumber;
      const last5Digits = originalPeriodNumber.substring(originalPeriodNumber.length - 5);

      document.getElementById('period-display').textContent = last5Digits;

      // Calculate remaining seconds (30-second intervals)
      const remainingSeconds = 30 - (seconds % 30);
      document.getElementById('timer-display').textContent = '00:' + String(remainingSeconds).padStart(2, '0');

      // Change prediction when timer resets
      if (remainingSeconds === 30) {
        generateNumbers();
      }
    }

    function startPredictionSystem() {
      generateNumbers();
      updatePeriodAndTimer();
      predictionInterval = setInterval(updatePeriodAndTimer, 1000);
    }
  </script>
</body>
</html>
